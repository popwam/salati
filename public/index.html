<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="الصفحات القانونية الرسمية لتطبيق صلاتي (Salati).">
  <title>صلاتي (Salati)</title>
  <style>
    :root { color-scheme:light; --bg:#f6f7f4; --card:#fff; --text:#15201b; --muted:#5f6b64; --accent:#0f7a55; --border:#dde5df; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.8; }
    main { width:min(760px,calc(100% - 32px)); margin:32px auto; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:clamp(20px,4vw,40px); box-shadow:0 18px 50px rgba(21,32,27,.08); }
    h1 { margin:0 0 8px; color:var(--accent); font-size:clamp(30px,7vw,46px); }
    p { color:var(--muted); }
    nav { display:grid; gap:12px; margin-top:28px; }
    a { display:block; padding:14px 18px; border:1px solid var(--border); border-radius:12px; color:var(--accent); text-decoration:none; font-weight:700; }
    a:hover { background:#f0f7f3; }
  </style>
</head>
<body>
  <main>
    <h1>صلاتي</h1>
    <p>الصفحات القانونية الرسمية لتطبيق صلاتي (Salati).</p>
    <nav aria-label="الصفحات القانونية">
      <a href="/privacy-policy">سياسة الخصوصية</a>
      <a href="/account-deletion">طلب حذف الحساب</a>
      <a href="/data-deletion">طلب حذف بيانات محددة</a>
      <a href="/terms-of-use">شروط الاستخدام</a>
      <a href="/child-safety">سلامة الأطفال</a>
    </nav>
  </main>
</body>
</html>
